# Example configuration for production deployment

server:
  host: "0.0.0.0"
  port: 8080
  # Per-service bind addresses (defaults to 'host' if not specified)
  admin_host: "127.0.0.1"    # Bind admin API to localhost only for security
  admin_port: 8081
  # engine_host: "0.0.0.0"   # Bind engine to all interfaces (uses 'host' by default)
  engine_port: 8082
  # registry_host: "0.0.0.0" # Bind registry to all interfaces (uses 'host' by default)
  registry_port: 8097
  # Peers whose X-Forwarded-For is believed for the client IP (per-IP rate limits).
  # UNSET = trust every peer (legacy default): any direct caller can pick its own IP
  # and dodge the per-IP limit. Set it in production: your load balancer's
  # addresses/CIDRs, or ["none"] when clients connect directly.
  # trusted_proxies: ["10.0.0.0/8"]
  rp_id: "wallet.example.com"
  rp_origin: "https://wallet.example.com"
  # rp_origins allows multiple WebAuthn RP origins (e.g. for Android/iOS native app wrappers).
  # When set, these are combined with rp_origin (if present) and deduplicated.
  # Use rp_origins alone or alongside rp_origin for a gradual migration; at least one must be set.
  # rp_origins:
  #   - "https://wallet.example.com"
  #   - "android:apk-key-hash:YOUR_APK_KEY_HASH_HERE"
  rp_name: "Example Wallet"
  base_url: "https://wallet.example.com"

  # CORS configuration for production
  cors:
    # Specify exact origins in production
    allowed_origins:
      - "https://wallet.example.com"
      - "https://app.example.com"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "Authorization"
      - "Content-Type"
      - "X-Tenant-ID"
      - "If-None-Match"
      - "X-Private-Data-If-Match"
      - "X-Private-Data-If-None-Match"
      - "Upgrade"
      - "Connection"
      - "Sec-WebSocket-Key"
      - "Sec-WebSocket-Version"
      - "Sec-WebSocket-Protocol"
    exposed_headers:
      - "X-Private-Data-ETag"
    # Can be true with specific origins
    allow_credentials: true
    max_age: 43200

  # External URLs for split-mode deployment
  # Use these when running services as separate containers/pods
  external_urls:
    backend_url: "https://api.wallet.example.com"
    engine_url: "wss://ws.wallet.example.com"
    registry_url: "https://registry.wallet.example.com"
    admin_url: "https://admin.wallet.example.com"

storage:
  type: "mongodb"
  
  mongodb:
    uri: "mongodb://username:password@mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0"
    database: "wallet_production"
    timeout: 10

logging:
  level: "info"
  format: "json"

jwt:
  # IMPORTANT: Use a strong secret (min 32 characters)
  # Generate with: openssl rand -base64 32
  # (It signs no tokens: it keys the OIDC state-binding cookie.)
  secret: "${WALLET_JWT_SECRET}"
  # Fallback for as.issuer (the "iss" of AS-issued access tokens)
  issuer: "wallet.example.com"

# Authorization Server: AS-issued session tokens are the only authentication
# mechanism (the legacy HMAC token flow was removed; remove any as.legacy.*,
# jwt.expiry_hours and jwt.refresh_days from older configs). A signing key is
# required: an ECDSA P-256/P-384 or Ed25519 PEM key, or an HSM key
# (as.signing_key_pkcs11).
as:
  enabled: true
  signing_key_path: "/etc/wallet-backend/as-signing-key.pem"
  rules_dir: "/app/rules"
  external_url: "https://wallet.example.com"
  issuer: "https://wallet.example.com"
