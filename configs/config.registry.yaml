# Configuration for a registry-only deployment (`--mode=registry`), which is
# also the default of the go-wallet-registry helper image
# (Dockerfile.registry). Only the parts of the backend configuration the
# registry role needs are listed; server address, logging and CORS are the
# backend's own settings.
#
# Every key can be set through WALLET_* environment variables, e.g.
#   WALLET_REGISTRY_SOURCE_URL, WALLET_REGISTRY_REQUIRE_AUTH,
#   WALLET_SERVER_REGISTRY_PORT, WALLET_AS_EXTERNAL_URL, WALLET_AS_ISSUER.

server:
  host: "0.0.0.0"
  # Registry-only processes listen on registry_port (default 8097).
  registry_port: 8097
  cors:
    allowed_origins:
      - "*"

logging:
  level: "info"
  format: "json"

# Only keys that differ from the built-in defaults are listed, so deprecated
# REGISTRY_* variables (and any other key) still apply to everything else. See
# docs/CONFIGURATION.md for all registry.* keys; the cache defaults to
# data/vctm-cache.json, which is /app/data in the image (WORKDIR /app).
registry:
  dynamic_cache:
    # Enabled in the image, as the retired registry image did. Restrict with
    # allowed_hosts in production.
    enabled: true
  # true: every request needs a valid AS-issued access token, validated through
  # the AS JWKS at as.external_url (no JWKS override exists; the legacy HMAC
  # tokens of the removed legacy AS are not accepted).
  # require_auth: true

# Needed only when registry.require_auth is true (or to recognise tokens for
# the authenticated rate limit). This process does not run the authorization
# server (as.enabled stays false); it validates the tokens the AS issues.
as:
  # Public base URL of the authorization server; JWKS is fetched from
  # <external_url>/auth/.well-known/jwks.json. New-style (ES256) tokens must
  # carry the "wallet-registry" audience.
  external_url: ""
  # Expected "iss" claim (defaults to jwt.issuer).
  issuer: ""
